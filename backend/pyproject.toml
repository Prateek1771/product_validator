[project]
name = "markresearcher-api"
version = "0.1.0"
description = "Agentic market intelligence API"

authors = [
    { name = "prateek1771", email = "hitliprateek6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "context-dev>=2.21.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "firecrawl-py>=4.45.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.4",
    "langchain-core>=1.6.5",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.4.11",
    "tavily-python>=0.8.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
