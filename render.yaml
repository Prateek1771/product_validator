# Render Blueprint: FastAPI + LangGraph backend (Docker). New → Blueprint → pick this repo.
services:
  - type: web
    name: mkt-intel-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore          # next to the InsForge ap-southeast project
    plan: free                 # sleeps after 15 min idle: keep awake with a /health ping every 10 min (fits the 750 free hours)
    numInstances: 1            # run registry + meters live in memory; scale out only after moving them to Redis
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_LLM_MODEL
        value: gpt-4o-mini
      - key: OPENAI_STRONG_MODEL
        value: gpt-4.1
      - key: JEV_MODEL
        value: typesafe/jev-1.13
      - key: LANGSMITH_TRACING
        value: "false"
      - key: CORS_ORIGINS
        sync: false            # https://<your-vercel-app>.vercel.app
      - key: INSFORGE_BASE_URL
        sync: false
      - key: INSFORGE_API_KEY
        sync: false
      - key: SECRETS_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CONTEXT_DEV_API_KEY
        sync: false
      - key: TAVILY_SEARCH_API_KEY
        sync: false
      - key: FIRECRAWL_API_KEY
        sync: false
